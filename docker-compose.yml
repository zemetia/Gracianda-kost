services:
  postgres:
    image: postgres:16-alpine
    container_name: gracianda-kost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gracianda
      POSTGRES_PASSWORD: gracianda
      POSTGRES_DB: gracianda_kost
    ports:
      - '5434:5432'
    volumes:
      - gracianda_kost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gracianda -d gracianda_kost']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gracianda_kost_pgdata:
